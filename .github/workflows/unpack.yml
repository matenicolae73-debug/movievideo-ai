name: Unpack ViralMovie

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ViralMovie API
        run: |
          unzip -o viralmovie-api-final.zip -d .
          rm -f viralmovie-api-final.zip

      - name: Verify project
        run: |
          echo "=== ViralMovie files ==="
          test -f package.json
          test -d app
          test -d lib
          echo "Project unpacked successfully!"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack ViralMovie API"
            git push
          fi
