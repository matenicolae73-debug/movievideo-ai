name: Unpack ViralForge AI

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p unpacked
          unzip -o "ViralForge-AI-Coca-Cola-Demo.zip" -d unpacked

      - name: Move project files
        run: |
          cp -r unpacked/* .
          rm -rf unpacked
          rm -f "ViralForge-AI-Coca-Cola-Demo.zip"

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack ViralForge AI project" || echo "No changes"
          git push
