name: Install ViralForge project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf /tmp/viralforge
          mkdir -p /tmp/viralforge

          unzip -q "$ZIP" -d /tmp/viralforge

          echo "Extracted files:"
          find /tmp/viralforge -maxdepth 3 -type f | head -100

      - name: Install project at repository root
        run: |
          PROJECT_DIR="/tmp/viralforge"

          if [ -f "$PROJECT_DIR/package.json" ]; then
            echo "Project is directly inside ZIP."
          else
            FOUND=$(find "$PROJECT_DIR" -mindepth 1 -maxdepth 2 -name package.json -print -quit)

            if [ -z "$FOUND" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")
            echo "Project directory: $PROJECT_DIR"
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a "$PROJECT_DIR"/. .

          echo "Final project:"
          ls -la

      - name: Remove ZIP files
        run: |
          rm -f ./*.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Install ViralForge AI project"
            git push
          fi
