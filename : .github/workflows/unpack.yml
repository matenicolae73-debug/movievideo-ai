name: Unpack ViralMovie

on:
  workflow_dispatch:
  push:
    paths:
      - "viralmovie-api-final.zip"

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          unzip -o viralmovie-api-final.zip -d extracted

      - name: Copy project to root
        run: |
          cp -r extracted/* .
          cp -r extracted/.[!.]* . 2>/dev/null || true
          rm -rf extracted
          rm -f viralmovie-api-final.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack ViralMovie API"
          git push
