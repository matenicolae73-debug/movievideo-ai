name: Unpack ViralMovie

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip ViralMovie
        run: |
          unzip -o viralmovie-api-final.zip -d .
          rm -f viralmovie-api-final.zip

      - name: Show files
        run: |
          echo "ViralMovie unpacked successfully:"
          find . -maxdepth 3 -type f | sort

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack ViralMovie API"
          git push
